server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=60s ipv6=off;

    location = /admin/seo {
        try_files /admin/seo.html =404;
    }

    location ~ ^/api/seo-(data|sync-admin)$ {
        set $seo_backend stairs-site.vercel.app;
        proxy_pass https://$seo_backend$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name $seo_backend;
        proxy_set_header Host $seo_backend;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
