<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tekstura SVG preview cards</title>
  <style>
    body{margin:0;padding:24px;background:#120f0b;color:#f5e4c9;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    h1{margin:0 0 18px;font-size:28px}
    .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
    figure{margin:0;padding:14px;border:1px solid rgba(221,183,134,.28);border-radius:18px;background:#1a1510}
    img{display:block;width:100%;height:auto;border-radius:12px}
    figcaption{margin-top:10px;font-weight:800}
  </style>
</head>
<body>
  <h1>SVG preview-карточки из конструктора замеров Tekstura</h1>
  <section class="grid">
    <figure><img src="../assets/calculator-preview/svg/stair-straight-card.svg" alt="stair-straight-card"><figcaption>stair-straight-card</figcaption></figure>
    <figure><img src="../assets/calculator-preview/svg/stair-turn-90-card.svg" alt="stair-turn-90-card"><figcaption>stair-turn-90-card</figcaption></figure>
    <figure><img src="../assets/calculator-preview/svg/stair-turn-180-card.svg" alt="stair-turn-180-card"><figcaption>stair-turn-180-card</figcaption></figure>
    <figure><img src="../assets/calculator-preview/svg/stair-landing-card.svg" alt="stair-landing-card"><figcaption>stair-landing-card</figcaption></figure>
    <figure><img src="../assets/calculator-preview/svg/stair-winder-card.svg" alt="stair-winder-card"><figcaption>stair-winder-card</figcaption></figure>
  </section>
</body>
</html>
